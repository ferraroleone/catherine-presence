name: Catherine - Manter Disponivel
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  set-presence:
    runs-on: ubuntu-latest
    steps:
      - name: Definir presenca como Disponivel
        run: |
          pip install requests -q
          python3 - <<'EOF'
          import requests, sys
          TENANT_ID     = "${{ secrets.TENANT_ID }}"
          CLIENT_ID     = "${{ secrets.CLIENT_ID }}"
          CLIENT_SECRET = "${{ secrets.CLIENT_SECRET }}"
          USER_ID       = "${{ secrets.USER_ID }}"
          t = requests.post(f"https://login.microsoftonline.com/{TENANT_ID}/oauth2/v2.0/token",
              data={"grant_type":"client_credentials","client_id":CLIENT_ID,"client_secret":CLIENT_SECRET,"scope":"https://graph.microsoft.com/.default"})
          if t.status_code != 200: print("Erro token:",t.text); sys.exit(1)
          r = requests.post(f"https://graph.microsoft.com/v1.0/users/{USER_ID}/presence/setPresence",
              headers={"Authorization":f"Bearer {t.json()['access_token']}","Content-Type":"application/json"},
              json={"sessionId":"CatherinePresence","availability":"Available","activity":"Available","expirationDuration":"PT4H"})
          print("OK" if r.status_code in(200,204) else f"Erro {r.status_code}: {r.text}"); sys.exit(0 if r.status_code in(200,204) else 1)
          EOF
